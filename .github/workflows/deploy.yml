name: CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project files
        run: |
          test -f index.html || (echo "ERROR: index.html missing" && exit 1)
          test -f style.css  || (echo "ERROR: style.css missing"  && exit 1)
          test -f script.js  || (echo "ERROR: script.js missing"  && exit 1)
          echo "OK: all required files present"

      - name: Check HTML structure
        run: |
          for f in *.html; do
            echo "Checking $f..."
            grep -q "<!DOCTYPE html>" "$f" || (echo "ERROR: $f missing DOCTYPE" && exit 1)
            grep -q "</html>"        "$f" || (echo "ERROR: $f missing closing html" && exit 1)
          done
          grep -q "jokes" script.js || (echo "ERROR: script.js missing jokes" && exit 1)
          echo "OK: structure valid, jokes intact"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            *.html
            *.css
            *.js
          retention-days: 1

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4